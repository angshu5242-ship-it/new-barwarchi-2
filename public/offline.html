<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Bawarchi 2 — Offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbf8f1;
        color: #292524;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        border: 1px solid #e9dfcf;
        border-radius: 24px;
        background: #fff;
        padding: 32px 24px;
        box-shadow: 0 20px 45px rgba(87, 60, 25, 0.12);
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 20px;
        background: #b06f1f;
        color: #fff;
        font-weight: 800;
        font-size: 22px;
      }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { color: #6d5d49; line-height: 1.6; }
      a {
        display: inline-block;
        margin-top: 14px;
        border-radius: 999px;
        background: #b06f1f;
        color: #fff;
        padding: 12px 20px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">N2</div>
      <h1>You are offline</h1>
      <p>Reconnect to see the live menu and place an order. You can also call +91 93669 86853.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
